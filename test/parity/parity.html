<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>brush-gpu parity grid</title>
    <style>
      body { margin: 16px; font: 11px/1.4 Menlo, Monaco, monospace; background: #eee; }
      .panes { display: flex; gap: 16px; align-items: flex-start; }
      figure { margin: 0; }
      figcaption { margin-bottom: 4px; color: #555; }
      #status { margin-bottom: 12px; }

  <body>
    <div id="status">rendering…</div>

      <figure>
        <figcaption id="right-caption">right</figcaption>
        <div id="right-host"></div>
      </figure>
    </div>
    <script type="module" src="./parity.js"></script>
  </body>
</html>
